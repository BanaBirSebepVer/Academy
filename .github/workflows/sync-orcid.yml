name: Sync ORCID Publications

on:
  schedule:
    # Run monthly on the 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-orcid:
    name: Sync Publications from ORCID
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ORCID Publication Sync Script
        run: python scripts/sync_orcid.py

      - name: Commit and Push New Publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _publications/
          if git diff --staged --quiet; then
            echo "No new publications found. Working directory clean."
          else
            git commit -m "chore: sync publications from ORCID [skip ci]"
            git push
          fi
