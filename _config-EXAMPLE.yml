# Site settings
title: Can Bekcan
email: can@canbekcan.com
description: "Akademik CV - Can Bekcan - Doğu Akdeniz Üniversitesi İletişim Fakültesi"
baseurl: "/Academy"
url: "https://canbekcan.github.io"
repository: "canbekcan/Academy"
github_repo: "https://github.com/canbekcan/Academy"
author: "Can Bekcan"
encoding: utf-8
favicon: "/favicon.ico"

# Multilingual Settings (Native GitHub Pages Compatible - No Custom Plugins)
default_lang: "tr"
languages: ["tr", "en"]

# Build settings
markdown: kramdown
future: true
kramdown:
  input: GFM
  hard_wrap: false

permalink: /yazilar/:year/:month/:day/:title/

# Collections Registration (Clean, duplicate-free)
collections:
  posts:
    output: true
  lessons:
    output: true
  publications:
    output: true
  project:
    output: true
  educations:
    output: false
  awards:
    output: false
  academic_positions:
    output: false
  conferences:
    output: false
  experiences:
    output: false
  memberships:
    output: false
  certificates:
    output: false
  person:
    output: false

# Scoped Defaults for Automated Language & Routing Assignment
defaults:
  # --- Lessons ---
  - scope:
      path: "_lessons/tr"
      type: "lessons"
    values:
      layout: "lesson"
      lang: "tr"
      permalink: "/dersler/:name/"
  - scope:
      path: "_lessons/en"
      type: "lessons"
    values:
      layout: "lesson"
      lang: "en"
      permalink: "/en/lessons/:name/"

  # --- Posts ---
  - scope:
      path: "_posts/tr"
      type: "posts"
    values:
      layout: "post/single"
      lang: "tr"
      permalink: "/yazilar/:year/:month/:day/:title/"
  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      layout: "post/single"
      lang: "en"
      permalink: "/en/posts/:year/:month/:day/:title/"

  # --- Publications ---
  - scope:
      path: "_publications/tr"
      type: "publications"
    values:
      layout: "publication/single"
      lang: "tr"
      permalink: "/yayinlar/:name/"
  - scope:
      path: "_publications/en"
      type: "publications"
    values:
      layout: "publication/single"
      lang: "en"
      permalink: "/en/publications/:name/"

  # --- Project Items ---
  - scope:
      path: "_project"
      type: "project"
    values:
      layout: "project/single"
      lang: "tr"
      permalink: "/projeler/:name/"

  # --- Pages ---
  - scope:
      path: "pages/tr"
    values:
      layout: "page"
      lang: "tr"
  - scope:
      path: "pages/en"
    values:
      layout: "page"
      lang: "en"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AI.md
  - ARCHITECTURE.md
  - CONTRIBUTING.md
  - LICENSE
  - migrate.sh
  - tree.txt
  - scripts/
  - .github/
  - node_modules
  - vendor
  - .DS_Store
