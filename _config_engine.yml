# ==============================================================================
# ACADEMY ENGINE CONFIGURATION (_config_engine.yml)
# Core framework architecture, collections, and routing defaults.
# Maintained by the Academy Engine developers.
# Users should NOT edit this file. User settings belong in _config.yml.
# ==============================================================================

# Build settings
markdown: kramdown
future: true
kramdown:
  input: GFM
  hard_wrap: false

permalink: /yazilar/:year/:month/:day/:title/

# Collections Registration
collections:
  posts:
    output: true
  lessons:
    output: true
  publications:
    output: true
  project:
    output: true
  educations:
    output: false
  awards:
    output: false
  academic_positions:
    output: false
  conferences:
    output: false
  experiences:
    output: false
  memberships:
    output: false
  certificates:
    output: false
  person:
    output: false

# Scoped Defaults for Automated Language & Routing Assignment
defaults:
  # --- Lessons ---
  - scope:
      path: "_lessons/tr"
      type: "lessons"
    values:
      layout: "lesson"
      lang: "tr"
      permalink: "/dersler/:name/"
  - scope:
      path: "_lessons/en"
      type: "lessons"
    values:
      layout: "lesson"
      lang: "en"
      permalink: "/en/lessons/:name/"

  # --- Posts ---
  - scope:
      path: "_posts/tr"
      type: "posts"
    values:
      layout: "post/single"
      lang: "tr"
      permalink: "/yazilar/:year/:month/:day/:title/"
  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      layout: "post/single"
      lang: "en"
      permalink: "/en/posts/:year/:month/:day/:title/"

  # --- Publications ---
  - scope:
      path: "_publications/tr"
      type: "publications"
    values:
      layout: "publication/single"
      lang: "tr"
      permalink: "/yayinlar/:name/"
  - scope:
      path: "_publications/en"
      type: "publications"
    values:
      layout: "publication/single"
      lang: "en"
      permalink: "/en/publications/:name/"

  # --- Project Items ---
  - scope:
      path: "_project/tr"
      type: "project"
    values:
      layout: "project/single"
      lang: "tr"
      permalink: "/projeler/:name/"
  - scope:
      path: "_project/en"
      type: "project"
    values:
      layout: "project/single"
      lang: "en"
      permalink: "/en/projects/:name/"

  # --- Pages ---
  - scope:
      path: "pages/tr"
    values:
      layout: "page"
      lang: "tr"
  - scope:
      path: "pages/en"
    values:
      layout: "page"
      lang: "en"

# Core Jekyll Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Ignored Files & Directories
exclude:
  - Gemfile
  - Gemfile.lock
  - _config-local.yml
  - _config-EXAMPLE.yml
  - README.md
  - AI.md
  - ARCHITECTURE.md
  - CONTRIBUTING.md
  - LICENSE
  - TASK.md
  - migrate.sh
  - tree.txt
  - serve.sh
  - scripts/
  - .github/
  - node_modules
  - vendor
  - .DS_Store
